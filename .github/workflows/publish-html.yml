name: Publish HTML page
run-name: "Publish ${{ inputs.input_path }}"

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: '게시할 HTML 경로 (예: public/test1.html)'
        required: true
        type: string
        default: 'public/'

permissions:
  contents: read

concurrency:
  group: html-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      page_url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: published-pages
          path: _published
      - name: Verify publisher
        run: python3 -m unittest discover -s tests -v
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Publish selected HTML
        id: publish
        env:
          INPUT_PATH: ${{ inputs.input_path }}
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/publish_selected.py
      - name: Retain published pages
        working-directory: _published
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site registry.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish selected HTML (run $GITHUB_RUN_ID)"
            git push origin HEAD:published-pages
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _published/site
      - uses: actions/upload-artifact@v4
        with:
          name: selected-page
          path: page-result/result.json
          retention-days: 7

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ needs.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: selected-page
          path: page-result
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 이용자에게 전달할 결과 링크
        env:
          WRITE_SUMMARY: 'true'
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/publish_selected.py
